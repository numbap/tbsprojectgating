  - link "Gate 5 Detailed project plan and functional specifications Do we know enough to commit to build, at a cost and schedule we can hold? Confirms that requirements and specifications are complete enough to build, and that scope, schedule and cost are baselined with a substantive estimate. This is the last gate before major spending, contract award or construction, and typically where full expenditure authority is confirmed.":
