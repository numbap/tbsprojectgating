- main:
  - heading "Gate guide" [level=1]
  - paragraph: The seven gates of the TBS gating model, what each one decides, who decides, what evidence it expects and the requirements first due there.
  - heading "Scale the gating to the project" [level=2]
  - paragraph: Not every project needs seven gates. The streamlined and light models combine gates for smaller or less risky projects. Your departmental framework decides which models are available.
  - heading "Full gating (seven gates) recommended" [level=3]
  - paragraph: Very large, highly complex or high-risk projects.
  - list:
    - listitem:
      - strong: G1
      - text: Strategic assessment and concept (1)
    - listitem:
      - strong: G2
      - text: Project approach (2)
    - listitem:
      - strong: G3
      - text: Business case and general readiness (3)
    - listitem:
      - strong: G4
      - text: Project charter and project management plan (4)
    - listitem:
      - strong: G5
      - text: Detailed project plan and functional specifications (5)
    - listitem:
      - strong: G6
      - text: Construction complete and deployment readiness (6)
    - listitem:
      - strong: G7
      - text: Post-implementation review (7)
  - heading "Streamlined gating (five gates)" [level=3]
  - paragraph: Projects of medium size, risk and complexity.
  - list:
    - listitem:
      - strong: S1
      - text: Approach (1 + 2)
    - listitem:
      - strong: S2
      - text: Business case (3)
    - listitem:
      - strong: S3
      - text: Pre-construction (4 + 5)
    - listitem:
      - strong: S4
      - text: Pre-deployment (6)
    - listitem:
      - strong: S5
      - text: Post-implementation (7)
  - heading "Light gating (three gates)" [level=3]
  - paragraph: Small, low-risk projects with little complexity.
  - list:
    - listitem:
      - strong: L1
      - text: Business case (1 + 2 + 3)
    - listitem:
      - strong: L2
      - text: Pre-construction (4 + 5)
    - listitem:
      - strong: L3
      - text: Post-implementation (6 + 7)
  - paragraph: "Deployment readiness is not a formal gate in this model: the project board confirms it before go-live, and it is reviewed at the post-implementation gate."
