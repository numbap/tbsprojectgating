    - listitem: Technology
    - listitem: Funding
    - listitem: Procurement
    - listitem: Project structure and management
  - heading "Watch out" [level=2]
  - list:
    - listitem: Baselining a schedule the team does not believe.
    - listitem: Contingency removed to make the number fit.
    - listitem: Privacy and security assessments left until just before go-live.
