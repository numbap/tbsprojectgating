  - text: / G5 Detailed project plan and functional specifications
  - 'heading "Gate 5: Detailed project plan and functional specifications" [level=1]'
  - paragraph:
    - emphasis: Do we know enough to commit to build, at a cost and schedule we can hold?
  - paragraph: Confirms that requirements and specifications are complete enough to build, and that scope, schedule and cost are baselined with a substantive estimate. This is the last gate before major spending, issuing requests for proposals, contract award or construction. For projects above the minister's authority, this is when Treasury Board project approval and expenditure authority for implementation are sought.
  - heading "Decision sought" [level=2]
  - paragraph: Approve the baseline and authorize implementation spending and contract award, or re-plan.
  - heading "Expected cost and schedule estimate accuracy" [level=2]
  - paragraph: Substantive, about ±15% for the whole project; contingency should never fall below 10 to 15%.
  - heading "Typical gatekeepers" [level=2]
  - list:
    - listitem: Project sponsor
    - listitem: Departmental investment committee
    - listitem: Chief financial officer
    - listitem: Treasury Board, when expenditure authority must be confirmed
  - heading "Key deliverables" [level=2]
  - list:
    - listitem: Functional and non-functional requirements
    - listitem: Baselined integrated schedule and work breakdown
    - listitem: Substantive cost estimate with contingency
    - listitem: Privacy, security and accessibility assessments under way or done
    - listitem: Contract award readiness
  - heading "Review topics" [level=2]
  - list:
