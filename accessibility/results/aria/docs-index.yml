  - heading "Accessibility features" [level=2]
  - list:
    - listitem: Fully operable with a keyboard. A skip link bypasses the navigation, and focus moves to the page heading after navigation.
    - listitem: Works with screen readers through native HTML semantics. Status changes (answer status, analysis results, search counts, confirmations) are announced.
    - listitem: Available in English and French; the page language is set accordingly, and reports are produced in the selected language.
    - listitem: Follows your system's dark mode, with a manual toggle. Supports Windows high contrast (forced colours) and reduced motion settings.
    - listitem: Reflows to a single column down to 320 CSS px (400% zoom) without horizontal scrolling. Report tables scroll within their own area.
    - listitem: No time limits, no flashing content, and confirmation before data is deleted or replaced.
  - heading "Known limitations" [level=2]
  - list:
    - listitem: The subject matter uses specialized governance terminology and acronyms; there is no glossary yet (EN 301 549 4.2.10).
    - listitem: The French text was drafted with machine assistance and has not yet been reviewed by a certified translator. The VPAT, test report and evidence documents are in English only.
    - listitem: Downloaded files (Markdown, CSV, JSON) and printed PDFs have not been evaluated for accessibility.
    - listitem: Testing has used Chromium only. Firefox and Safari have not yet been tested.
  - heading "Compatibility" [level=2]
  - paragraph: Designed for current versions of Chrome, Edge, Firefox and Safari with JavaScript enabled. It relies on HTML, CSS, JavaScript and WAI-ARIA.
  - heading "Feedback" [level=2]
  - paragraph:
    - text: If you find a barrier, please
    - link "report an accessibility problem":
      - /url: https://github.com/numbap/tbsprojectgating/issues/new?labels=accessibility&title=Accessibility%3A%20
    - text: . Include the page, what you were trying to do, and the browser and assistive technology you use. Problems that block a task are fixed before the next release.
  - heading "How this statement is maintained" [level=2]
  - paragraph:
    - text: An automated accessibility suite runs on every commit, and this statement, the VPAT and the test report are recompiled from its results. If a check fails, the build fails and the affected criteria are downgraded. When the user interface changes, the manual review is flagged as pending until a reviewer re-confirms it. See the
    - link "strategy":
      - /url: strategy.html
    - text: .
