- main:
  - heading "Accessibility statement" [level=1]
  - paragraph: The Project Gating Navigator aims to be usable by everyone, including people who use assistive technologies. We target WCAG 2.2 Level AA and EN 301 549 v3.2.1.
  - heading "Conformance status" [level=2]
  - paragraph: Version 1.0.1 does not currently fully conform. 1 WCAG criteria are affected by automated failures; see the VPAT.
  - paragraph:
    - strong: Manual review pending.
    - text: "The user interface has changed since the last attested manual review (2026-10-15). Changed:"
    - code: css/styles.css
    - text: . Automated results in this report are current; judgements based on code review or visual inspection must be re-confirmed (
    - code: npm run a11y:attest
    - text: ).
  - paragraph:
    - text: This is a self-assessment. It has
    - strong: not yet been verified with assistive technology or by an independent auditor
    - text: ; see the
