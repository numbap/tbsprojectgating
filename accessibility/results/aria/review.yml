- main:
  - heading "2. Review project documents" [level=1]
  - paragraph: "Paste project documentation: a concept note, charter, business case draft, status report or briefing note. The review maps each statement to requirements, flags caveats such as \"TBD\", \"planned\" or \"draft\", and suggests scope answers. It reads English and French."
  - text: Document text
  - textbox "Document text":
    - /placeholder: e.g. The estimated total cost is $12 million. The project sponsor is the ADM, Corporate Services. A privacy impact assessment will be completed...
    - text: "ClaimPath Online will replace the paper application process for the Example Benefit with a digital service for Canadians. The problem: applicants wait an average of 14 weeks for a decision, and 30% of paper applications are returned as incomplete. The project sponsor is the Assistant Deputy Minister, Service Delivery Branch, who chairs the steering committee. The steering committee terms of reference set tolerances of 10% on cost and 3 months on schedule. The estimated total cost is $38 million over four years, including ongoing operations for the first two years. Funding will come from Budget 2026 through a Memorandum to Cabinet and a Treasury Board submission; new funding is required. Our PCRA is expected to be level 3 (Evolutionary); the department holds an OPMCA class 2 rating. An options analysis compared the status quo, enhancing the legacy case system and a SaaS case management platform. The recommended option is to configure a commercial SaaS case management platform hosted in a Canadian cloud region. The solution will collect personal information from applicants and process Protected B data. A privacy impact assessment is planned with the ATIP office during design. Eligibility triage will use a rules engine to recommend decisions; an Algorithmic Impact Assessment is to be determined. Delivery will be agile, with releases every quarter and a minimum viable product for one region first. Procurement will use the existing supply arrangement for cloud services; a request for proposals is not expected. The business case is in draft and will be presented to the departmental investment committee in the spring. Benefits include reducing average processing time from 14 weeks to 4 weeks and cutting incomplete applications in half. A risk register is maintained and reviewed monthly by the project team. The project will be presented to the GC EARB at concept stage. Change management and training plans are not yet developed. Lessons learned from the 2019 modernization pilot have been reviewed."
