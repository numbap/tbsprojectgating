- main:
  - heading "Déclaration d'accessibilité" [level=1]
  - paragraph: Le Navigateur des points de contrôle de projet vise à être utilisable par tous, y compris les personnes qui utilisent des technologies d'assistance. Nous visons le niveau AA des WCAG 2.2 et la norme EN 301 549 v3.2.1.
  - heading "État de conformité" [level=2]
  - paragraph: "La version 1.0.0 est évaluée comme conforme au niveau AA des WCAG 2.2 : 45 critères pris en charge et 11 sans objet."
  - paragraph:
    - strong: Examen manuel en attente.
    - text: L'interface a changé depuis le dernier examen manuel attesté. Les résultats automatisés sont à jour.
  - paragraph:
    - text: Il s'agit d'une autoévaluation. Elle n'a
    - strong: pas encore été vérifiée avec des technologies d'assistance ni par un vérificateur indépendant
    - text: .
  - heading "Documents" [level=2]
  - paragraph: "Les documents détaillés sont en anglais seulement :"
  - list:
    - listitem:
      - link "Accessibility Conformance Report (VPAT 2.5Rev)":
        - /url: vpat.html
    - listitem:
      - link "Automated test report":
        - /url: test-report.html
    - listitem:
      - link "Accessibility statement":
        - /url: index.html
      - text: et documents de preuve
  - heading "Caractéristiques d'accessibilité" [level=2]
  - list:
    - listitem: Entièrement utilisable au clavier. Un lien d'évitement permet de passer la navigation, et le focus passe au titre de la page après chaque navigation.
    - listitem: Compatible avec les lecteurs d'écran grâce à la sémantique HTML native. Les changements d'état (état des exigences, résultats d'analyse, nombre de résultats de recherche, confirmations) sont annoncés.
    - listitem: Offert en français et en anglais; la langue de la page est définie en conséquence, et les rapports sont produits dans la langue choisie.
    - listitem: Suit le mode sombre du système, avec un bouton manuel. Prend en charge le contraste élevé de Windows et la réduction des animations.
    - listitem: S'adapte à une seule colonne jusqu'à 320 px CSS (zoom de 400 %) sans défilement horizontal.
    - listitem: Aucune limite de temps imposée, aucun contenu clignotant, et confirmation avant la suppression ou le remplacement de données.
  - heading "Limites connues" [level=2]
  - list:
    - listitem: Le sujet utilise une terminologie et des acronymes spécialisés en gouvernance; il n'y a pas encore de glossaire.
    - listitem: Le texte français a été rédigé avec l'aide d'outils de traduction automatique et n'a pas encore été révisé par un traducteur agréé.
    - listitem: Les fichiers téléchargés (Markdown, CSV, JSON) et les PDF imprimés n'ont pas été évalués.
    - listitem: Les essais ont été faits avec Chromium seulement.
  - heading "Rétroaction" [level=2]
  - paragraph:
    - text: Si vous rencontrez un obstacle, veuillez
    - link "signaler un problème d'accessibilité":
      - /url: https://github.com/numbap/tbsprojectgating/issues/new?labels=accessibility&title=Accessibility%3A%20
    - text: . Indiquez la page, ce que vous tentiez de faire, ainsi que le navigateur et la technologie d'assistance utilisés.
