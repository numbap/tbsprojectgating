    - paragraph: "Self-assessment against paraphrased requirements of the Directive on the Management of Projects and Programmes, the Policy on the Planning and Management of Investments, related policy instruments and TBS gating guidance. Applicability is derived from the project profile; status from questionnaire answers or overrides. Met and departmental items score 1, partial 0.5, planned 0.25, others 0. Readiness for a gate counts every requirement due at or before it. The complexity estimate is indicative and the approval determination is a guide: confirm both with your project management office, CFO and the Treasury Board Secretariat. This tool is not an official Government of Canada product and does not replace your departmental framework."
