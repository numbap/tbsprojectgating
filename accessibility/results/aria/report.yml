    - heading "6. Right-sizing opportunities" [level=2]
    - paragraph: These choices reduce complexity, risk or governance effort across several requirements at once, legitimately.
    - list:
      - listitem:
        - strong: "Reduce real complexity: smaller, independent releases"
        - text: ". Delivering in increments with their own outcomes lowers the PCRA honestly, shortens feedback loops and limits what is at risk at each gate. Affects CAP-1, CAP-3, PLN-4, PLN-5, RSK-1, PLN-9 · closes or shrinks 3 current gap(s): CAP-1, CAP-3, RSK-1"
      - listitem:
        - strong: Reuse an enterprise or commercial solution
        - text: ". Configuring a proven GC platform or SaaS product removes custom design and build risk, simplifies architecture review and inherits security controls. Affects INV-3, DIG-6, APP-4, DIG-1, PLN-6, DIG-4 · closes or shrinks 2 current gap(s): INV-3, APP-4"
      - listitem:
        - strong: Keep a person in the decision loop
        - text: ". Using automation to support, rather than make, high-impact decisions lowers the algorithmic impact level and its requirements. Affects DIG-3 · closes or shrinks 1 current gap(s): DIG-3"
      - listitem:
        - strong: Release funding in tranches tied to gates
        - text: ". Committing money only to the next gate limits exposure and gives gatekeepers a real decision at each step. Affects INV-5, APP-2, PLN-5 · closes or shrinks 1 current gap(s): INV-5"
      - listitem:
        - strong: Collect less personal information
        - text: . Every element of personal information you do not collect shrinks the privacy assessment, the security categorization and the breach exposure. Affects DIG-2, DIG-1, DIG-7
      - listitem:
        - strong: Agree an agile evidence map with gatekeepers
        - text: . Gatekeepers accept working software, release plans and measured outcomes in place of up-front documents when this is agreed in advance. Affects PLN-9, PLN-6, PLN-4, PLN-3
