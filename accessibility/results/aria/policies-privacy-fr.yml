  - paragraph:
    - emphasis: La version anglaise de cette politique fait foi. La présente traduction a été rédigée avec l'aide d'outils de traduction automatique et n'a pas encore été révisée par un traducteur agréé.
  - heading "Résumé" [level=2]
  - list:
    - listitem:
      - text: Le Navigateur des points de contrôle de projet est une application à
      - strong: code source ouvert
      - text: qui fonctionne
      - strong: entièrement dans votre navigateur Web
      - text: (côté client).
    - listitem:
      - strong: Elle n'envoie rien de ce que vous saisissez à un serveur
      - text: ": ni au projet, ni à GitHub, ni à un tiers. Il n'y a ni comptes, ni outils d'analyse, ni publicité, ni pixels de suivi, ni scripts ou polices de tiers."
    - listitem:
      - strong: Ce que vous enregistrez reste dans le stockage local de votre navigateur, sur votre appareil
      - text: ", chiffré à moins que vous ne choisissiez autrement pour du travail non classifié."
      - strong: L'application ne crée ni ne lit de témoins (cookies).
    - listitem: Vous pouvez effacer en tout temps tout ce que l'application a stocké.
  - heading "Comment nous nous assurons que rien n'est transmis" [level=2]
  - list:
    - listitem: L'application est constituée de fichiers statiques (HTML, CSS et JavaScript). Une fois que votre navigateur les a téléchargés, tout le traitement (portée, estimation de la complexité, analyse des documents, notation, production des rapports et chiffrement) se fait sur votre appareil.
    - listitem:
      - text: Chaque page déclare une
      - strong: politique de sécurité du contenu
      - text: avec
      - code: connect-src 'none'
      - text: et
      - code: form-action 'none'
      - text: . Votre navigateur bloque ainsi toute connexion réseau et toute soumission de formulaire, même si le code était modifié pour tenter de le faire. Les pages définissent aussi
      - code: referrer
      - text: à
      - code: no-referrer
      - text: .
    - listitem:
      - text: Les essais automatisés du projet font échouer la compilation si le code de l'application contient une interface réseau ou de témoins (
      - code: fetch
      - text: ","
      - code: XMLHttpRequest
      - text: ","
      - code: WebSocket
      - text: ","
      - code: sendBeacon
      - text: ","
      - code: document.cookie
      - text: et autres), ou si la politique de sécurité du contenu est affaiblie.
  - heading "Ce qui est stocké sur votre appareil" [level=2]
  - paragraph:
    - text: Tout est stocké au moyen du
    - code: localStorage
    - text: du navigateur pour l'adresse d'où l'application est servie. Rien n'est stocké dans des témoins, le
    - code: sessionStorage
    - text: ou IndexedDB.
