  - paragraph:
    - text: Si vous choisissez
    - strong: Non enregistré
    - text: ", l'application n'écrit que vos paramètres; l'évaluation n'existe que dans l'onglet ouvert."
  - paragraph: L'évaluation peut contenir des détails sur le projet (coûts, financement, approche d'approvisionnement, risques), vos réponses au questionnaire, vos notes, vos plans d'action et tout texte de document collé pour examen. Votre phrase de passe n'est jamais stockée. La clé de chiffrement n'est conservée qu'en mémoire pendant que l'évaluation est déverrouillée.
  - heading "Fichiers téléchargés" [level=2]
  - paragraph: Les rapports (Markdown, CSV, impressions) et les fichiers d'évaluation exportés sont créés sur votre appareil et enregistrés à l'endroit où votre navigateur enregistre les téléchargements. Vous contrôlez ces fichiers. Les exportations chiffrées ne peuvent être ouvertes qu'avec la phrase de passe que vous choisissez pour elles.
  - heading "L'hébergeur" [level=2]
  - paragraph:
    - text: Lorsque l'application est utilisée à partir de GitHub Pages, votre navigateur télécharge les fichiers de l'application à partir de GitHub. Comme tout serveur Web, GitHub reçoit les renseignements habituels d'une requête (votre adresse IP, l'agent utilisateur du navigateur, les fichiers demandés et l'heure) et peut les consigner conformément à la
    - link "déclaration générale de confidentialité de GitHub":
      - /url: https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement
    - text: . GitHub ne reçoit
    - strong: rien
    - text: de ce que vous tapez, collez, téléversez ou enregistrez dans l'application.
  - paragraph: Les organisations qui ne veulent aucune requête externe peuvent héberger leur propre copie de l'application (voir le fichier README); l'application ne fait alors aucune requête à l'extérieur de cet hôte.
  - heading "Liens vers d'autres sites" [level=2]
  - paragraph:
    - text: "Le pied de page renvoie au système de suivi des problèmes du projet sur GitHub pour signaler les problèmes d'accessibilité. Ce lien vous amène sur GitHub, dont la propre déclaration de confidentialité s'applique. Les signalements peuvent être publics :"
    - strong: n'y incluez aucun contenu d'évaluation ni aucune information protégée ou sensible.
  - heading "Effacer vos données" [level=2]
  - list:
    - listitem:
      - text: "Dans l'application :"
      - strong: Données et sécurité → Effacer toutes les données de ce navigateur
      - text: supprime toutes les clés énumérées ci-dessus.
    - listitem: "Dans votre navigateur : effacer les données du site pour l'adresse de l'application les supprime aussi."
    - listitem: Les fichiers téléchargés doivent être supprimés séparément.
  - paragraph: Pour l'information protégée, suivez aussi les procédures de votre ministère relatives à l'élimination de l'information et à l'assainissement des appareils.
  - heading "Renseignements personnels" [level=2]
  - paragraph:
    - text: L'application ne recueille pas de renseignements personnels. Tout renseignement personnel que vous saisissez dans une évaluation (par exemple le nom des responsables) reste sur votre appareil, sous votre contrôle. Si un ministère déploie ou modifie l'application, il lui incombe d'évaluer ses propres obligations en matière de protection de la vie privée, par exemple en vertu de la
    - emphasis: Loi sur la protection des renseignements personnels
    - text: .
  - heading "Modifications de la présente politique" [level=2]
  - paragraph: Les modifications sont apportées dans le dépôt public du code source; l'historique de la politique peut donc y être consulté. La date d'entrée en vigueur ci-dessus est mise à jour lorsque la politique change.
  - heading "Coordonnées" [level=2]
  - paragraph:
    - text: Les questions sur la présente politique peuvent être soumises au moyen du
    - link "système de suivi des problèmes":
      - /url: https://github.com/numbap/tbsprojectgating/issues
    - text: du projet. N'y incluez aucune information sensible.
