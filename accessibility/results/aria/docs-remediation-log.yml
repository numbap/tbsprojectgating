- main:
  - heading "Baseline audit and remediation log" [level=1]
  - paragraph:
    - text: The Project Gating Navigator is built on the user-interface framework, test suite and documentation pipeline of the
    - link "ITSG-33 Compliance Navigator":
      - /url: https://github.com/numbap/Itsg33
    - text: ", a sister tool by the same maintainers. Sections 1 to 5 record the audit and remediation of that framework (its baseline results are kept in"
    - code: baseline-results.json
    - text: ", in an earlier schema of the results format); those fixes carry over to this product. Section 6 records what the suite found when it was first run against this product."
  - paragraph: The framework's suite was first run before any accessibility work on 2026-10-15. Out of 131 scripted checks, 90 passed; axe-core reported 8 WCAG violations and 4 best-practice issues across 16 runs.
  - paragraph: The tables below record each finding, its cause, the fix and how it was verified. Every fix was verified by re-running the full suite. The final run passed with no WCAG violations and every scripted check passing.
