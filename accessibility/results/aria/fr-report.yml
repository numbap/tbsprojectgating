    - strong: GOV-5 Gestionnaire de projet et équipe de base qualifiés
    - text: Obligatoire Non évalué Ébauche
    - paragraph: ClaimPath Online est géré par un gestionnaire de projet ayant de l'expérience dans des projets de complexité comparable. Les rôles clés sont pourvus, et les lacunes restantes en matière de compétences sont comblées par un plan de dotation et de formation suivi par le comité directeur.
    - strong: PLN-2 Charte de projet approuvée
    - text: Obligatoire Non évalué Ébauche
    - paragraph: La charte de ClaimPath Online, approuvée par Assistant Deputy Minister, Service Delivery, énonce les objectifs, la portée, les livrables, la gouvernance, les rôles, les tolérances, le budget et les principaux jalons, conformément à l'analyse de rentabilisation approuvée.
    - strong: PLN-3 Plan de gestion de projet
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Le plan de gestion de ClaimPath Online précise comment la portée, le calendrier, les coûts, la qualité, les communications, les risques, les changements et les rapports sont gérés, au moyen des processus normalisés de Department of Example Services lorsqu'ils existent.
    - strong: PLN-7 Contrôle des changements et règles de rétablissement des données de référence
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Les changements à la portée, au calendrier et aux coûts de ClaimPath Online sont évalués et tranchés au moyen d'un processus de contrôle des changements. Les changements qui dépassent les tolérances sont renvoyés à l'autorité d'approbation.
    - strong: PLN-8 Plan des ressources
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Un plan des ressources de ClaimPath Online précise par trimestre les rôles, les compétences et le soutien contractuel nécessaires. Les experts en la matière des secteurs d'activité sont libérés pour des périodes convenues.
    - strong: PLN-9 Réalisation itérative associée aux points de contrôle
    - text: Obligatoire Non évalué Ébauche
    - paragraph: ClaimPath Online est réalisé de façon itérative. Sa feuille de route des versions montre comment les incréments s'associent aux points de contrôle, et les responsables ont convenu des éléments probants (logiciel fonctionnel et résultats mesurés pour les utilisateurs) présentés à chacun.
    - strong: RSK-2 Problèmes et décisions consignés
    - text: Recommandé Non évalué Ébauche
    - paragraph: Les problèmes et les décisions de ClaimPath Online sont consignés avec leurs responsables et leur justification, et examinés à chaque réunion d'équipe.
    - strong: DIG-6 Architecture harmonisée avec les normes du GC
    - text: Obligatoire Non évalué Ébauche
    - paragraph: L'architecture de ClaimPath Online respecte les attentes du GC en matière d'architecture intégrée, en réutilisant les solutions ministérielles et les services infonuagiques lorsque c'est possible et en gardant les données protégées au Canada.
    - strong: OCM-1 Plan de gestion du changement et de mobilisation des intervenants
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Un plan de gestion du changement de ClaimPath Online détermine les groupes touchés, les répercussions sur chacun et la façon dont ils sont mobilisés et préparés de la planification au déploiement.
    - strong: MON-1 Rapports d'étape réguliers par rapport aux tolérances
    - text: Obligatoire Non évalué Ébauche
    - paragraph: ClaimPath Online rend compte chaque mois à son comité directeur de la portée, du calendrier, des coûts, des risques et des avantages par rapport aux données de référence et aux tolérances, en s'appuyant sur des mesures plutôt que sur des opinions.
    - strong: MON-2 Rapports sur le portefeuille et rapports centraux
    - text: Obligatoire Non évalué Ébauche
    - paragraph: ClaimPath Online rend compte au portefeuille de projets de Department of Example Services et fournit les rapports exigés par le Secrétariat du Conseil du Trésor pour les projets sous surveillance centrale.
    - heading "G5 Plan de projet détaillé et spécifications fonctionnelles" [level=3]
    - strong: APP-2 Pouvoir de dépenser pour la mise en œuvre
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Le pouvoir de dépenser pour le coût de référence de ClaimPath Online a été confirmé avant les dépenses de mise en œuvre et l'attribution du contrat.
    - strong: APP-6 Autorité contractante et approbations
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Les contrats de ClaimPath Online sont passés par l'autorité contractante appropriée dans les limites contractuelles applicables; les approbations de contrat requises sont prévues avant l'attribution.
    - strong: PLN-4 Calendrier intégré établi en référence
    - text: Obligatoire Non évalué Ébauche
