    - strong: PLN-5 Estimation fondée des coûts et provision pour éventualités
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Le coût de ClaimPath Online est appuyé par une estimation fondée sur les soumissions et des projets comparables, avec une provision pour éventualités proportionnée au registre des risques et contrôlée par le promoteur.
    - strong: PLN-6 Exigences détaillées et spécifications convenues
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Les exigences de ClaimPath Online, y compris les exigences non fonctionnelles en matière de sécurité, de vie privée, d'accessibilité, de rendement et de langues officielles, sont documentées, rattachées aux résultats et acceptées par le responsable opérationnel.
    - strong: DIG-2 Évaluation des facteurs relatifs à la vie privée
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Une évaluation des facteurs relatifs à la vie privée de ClaimPath Online a été réalisée avec le bureau de l'AIPRP de Department of Example Services, approuvée, et ses recommandations ont été intégrées à la conception avant la mise en œuvre.
    - strong: DIG-3 Évaluation de l'incidence algorithmique
    - text: Obligatoire Non satisfait Ébauche
    - paragraph: "Une évaluation de l'incidence algorithmique de ClaimPath Online a été réalisée et publiée. Les exigences de son niveau d'incidence sont intégrées à la conception et vérifiées avant la mise en production. Cet énoncé décrit l'état visé. Les lacunes actuelles et les mesures sont consignées dans le plan d'action. Mesures provisoires : A person makes every final eligibility decision during the pilot."
    - strong: DIG-4 Accessibilité intégrée
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Les exigences d'accessibilité fondées sur la norme EN 301 549 font partie des spécifications et des contrats de ClaimPath Online, et la solution est mise à l'essai avec des technologies d'assistance et des utilisateurs en situation de handicap avant la mise en service.
    - strong: DIG-5 Langues officielles
    - text: Obligatoire Non évalué Ébauche
    - paragraph: "ClaimPath Online respecte les obligations en matière de langues officielles : le contenu, les avis et le soutien sont offerts en français et en anglais de qualité égale, et les deux versions sont mises à l'essai avant la publication."
    - strong: DIG-7 Gestion de l'information et des données
    - text: Obligatoire Non évalué Ébauche
    - paragraph: L'information à valeur opérationnelle créée par ClaimPath Online est déterminée, et la conservation, la disposition et la propriété des données sont définies avec l'équipe de gestion de l'information de Department of Example Services.
    - strong: OCM-3 Transition vers l'exploitation avec un responsable financé
    - text: Obligatoire Non évalué Ébauche
    - paragraph: ClaimPath Online passe à un responsable du service désigné, avec un modèle de soutien, des niveaux de service et un financement continu confirmés avant la mise en service.
    - heading "G6 Construction terminée et état de préparation au déploiement" [level=3]
