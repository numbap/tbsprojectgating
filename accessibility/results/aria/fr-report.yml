    - strong: DIG-1 Évaluation de la sécurité et autorisation
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Les exigences de sécurité de ClaimPath Online ont été établies à partir de sa catégorisation et intégrées à la conception. La solution a été évaluée et autorisée à être exploitée par l'autorité ministérielle d'autorisation avant son utilisation en production.
    - strong: OCM-2 Préparation des secteurs d'activité et formation
    - text: Obligatoire Non évalué Ébauche
    - paragraph: "L'état de préparation des secteurs d'activité pour ClaimPath Online a été confirmé par le responsable opérationnel : les processus et les procédures sont à jour, la dotation est en place et les utilisateurs sont formés."
    - strong: OCM-4 Critères de mise en service et plan de repli
    - text: Obligatoire Non évalué Ébauche
    - paragraph: La mise en service de ClaimPath Online est décidée selon des critères convenus à l'avance. Un plan de retour arrière et de contingence a été répété avant le déploiement.
    - strong: OCM-5 Essais et acceptation terminés
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Les essais de ClaimPath Online (fonctionnels, d'intégration, de rendement, de sécurité et d'acceptation par les utilisateurs) sont terminés. Il ne reste aucun défaut bloquant pour les activités, et le responsable opérationnel a accepté la solution.
    - heading "G7 Examen postérieur à la mise en œuvre" [level=3]
    - strong: BEN-3 Avantages mesurés après la mise en œuvre
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Les avantages de ClaimPath Online ont été mesurés par rapport à leurs points de départ et cibles après la mise en œuvre et communiqués à Assistant Deputy Minister, Service Delivery. Des mesures sont en place pour les avantages non encore réalisés.
    - strong: MON-4 Clôture officielle
    - text: Obligatoire Non évalué Ébauche
    - paragraph: "ClaimPath Online a été officiellement clos : livrables acceptés, contrats et finances fermés, documentation archivée et rapport de clôture approuvé par Assistant Deputy Minister, Service Delivery."
    - strong: MON-5 Examen postérieur à la mise en œuvre
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Un examen postérieur à la mise en œuvre de ClaimPath Online a évalué l'exploitation, les résultats et les leçons, et la réponse de la direction est suivie par le responsable opérationnel.
    - heading "Méthode et limites" [level=2]
    - paragraph: NON CLASSIFIÉ
    - paragraph: "Autoévaluation au regard d'exigences paraphrasées de la Directive sur la gestion des projets et programmes, de la Politique sur la planification et la gestion des investissements, d'instruments connexes et de l'orientation du SCT sur les points de contrôle. L'applicabilité est déduite du profil du projet; l'état, des réponses au questionnaire ou des valeurs forcées. Les éléments satisfaits et ministériels valent 1, partiels 0,5, prévus 0,25, autres 0. L'état de préparation à un point de contrôle compte toutes les exigences dues à ce point ou avant. L'estimation de la complexité est indicative et la détermination du pouvoir d'approbation est un guide : confirmez-les auprès de votre bureau de gestion de projet, de votre DPF et du Secrétariat du Conseil du Trésor. Cet outil n'est pas un produit officiel du gouvernement du Canada et ne remplace pas votre cadre ministériel."
