      - text: Business case in draft.
    - strong: INV-5 Source de financement confirmée
    - text: Obligatoire Partiellement satisfait Ébauche
    - paragraph: Le financement de ClaimPath Online est confirmé par le dirigeant principal des finances de Department of Example Services, avec un profil par exercice qui correspond au plan de dépenses. Cet énoncé décrit l'état visé. Les lacunes actuelles et les mesures sont consignées dans le plan d'action.
    - strong: INV-6 Estimation des coûts sur tout le cycle de vie
    - text: Obligatoire Partiellement satisfait Ébauche
    - paragraph: L'estimation des coûts de ClaimPath Online couvre tout le cycle de vie, y compris l'exploitation et le soutien continus. Sa catégorie, sa fourchette d'exactitude et ses hypothèses sont documentées, et elle a été examinée par le bureau du dirigeant principal des finances. Cet énoncé décrit l'état visé. Les lacunes actuelles et les mesures sont consignées dans le plan d'action.
    - strong: INV-7 ACS Plus réalisée
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Une ACS Plus de ClaimPath Online a été réalisée et examinée par le centre de l'ACS Plus de Department of Example Services. Ses constatations sont intégrées à la conception et aux mesures des avantages.
    - strong: APP-1 Approbation du projet demandée au Conseil du Trésor
    - text: Obligatoire Partiellement satisfait Ébauche
    - paragraph: ClaimPath Online dépasse le pouvoir d'approbation des projets de Department of Example Services. L'approbation du Conseil du Trésor est demandée au moyen d'une présentation appuyée par l'ECRP, l'analyse de rentabilisation, l'établissement des coûts, la stratégie d'approvisionnement et l'attestation du DPF, préparée avec le Secrétariat du Conseil du Trésor. Cet énoncé décrit l'état visé. Les lacunes actuelles et les mesures sont consignées dans le plan d'action.
    - strong: GAT-2 Examen indépendant aux points de contrôle clés
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Un examen indépendant de ClaimPath Online est prévu aux points de contrôle clés. Les examinateurs sont indépendants de l'équipe de projet, et la réponse de la direction à leurs recommandations est présentée aux responsables des points de contrôle.
    - strong: GAT-3 Conditions des points de contrôle antérieurs levées
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Toutes les conditions des points de contrôle antérieurs de ClaimPath Online sont levées ou ont été officiellement reportées avec l'accord des responsables.
    - strong: BEN-1 Avantages mesurables définis
    - text: Obligatoire Satisfait Ébauche
    - paragraph: Les avantages de ClaimPath Online sont définis avec un point de départ, une cible, une mesure et une date pour chacun, et sont liés aux résultats de l'analyse de rentabilisation.
    - strong: BEN-2 Plan de réalisation des avantages avec responsables
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Un plan de réalisation des avantages de ClaimPath Online attribue chaque avantage à un responsable opérationnel et précise comment et quand il est mesuré, y compris après la clôture du projet.
    - strong: PRO-1 Analyse du marché et stratégie d'approvisionnement
    - text: Obligatoire Non évalué Ébauche
    - paragraph: La stratégie d'approvisionnement de ClaimPath Online s'appuie sur une analyse du marché et a été convenue avec l'autorité contractante. Les jalons d'approvisionnement font partie du calendrier intégré.
    - strong: PRO-2 Autorité contractante et partenaires consultés tôt
    - text: Recommandé Non évalué Ébauche
    - paragraph: L'autorité contractante et, au besoin, Services partagés Canada ont été consultés lors de l'élaboration de l'analyse de rentabilisation de ClaimPath Online; leurs délais figurent au calendrier.
    - strong: MON-6 Données de référence au Bureau du contrôleur général
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Des données de référence sur la portée, le calendrier, les coûts et les risques de ClaimPath Online sont soumises au Bureau du contrôleur général après chaque approbation et à la clôture.
