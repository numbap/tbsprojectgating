    - heading "6. Possibilités d'adaptation" [level=2]
    - paragraph: Ces choix réduisent légitimement la complexité, les risques ou l'effort de gouvernance pour plusieurs exigences à la fois.
    - list:
      - listitem:
        - strong: "Réduire la complexité réelle : des versions plus petites et indépendantes"
        - text: ". La réalisation par incréments ayant leurs propres résultats abaisse honnêtement l'ECRP, raccourcit les boucles de rétroaction et limite ce qui est à risque à chaque point de contrôle. Touche CAP-1, CAP-3, PLN-4, PLN-5, RSK-1, PLN-9 · comble ou réduit 3 lacune(s) actuelle(s) : CAP-1, CAP-3, RSK-1"
      - listitem:
        - strong: Réutiliser une solution ministérielle ou commerciale
        - text: ". La configuration d'une plateforme éprouvée du GC ou d'un logiciel-service élimine les risques de conception et de développement sur mesure, simplifie l'examen de l'architecture et permet d'hériter des mesures de sécurité. Touche INV-3, DIG-6, APP-4, DIG-1, PLN-6, DIG-4 · comble ou réduit 2 lacune(s) actuelle(s) : INV-3, APP-4"
      - listitem:
        - strong: Garder une personne dans la boucle décisionnelle
        - text: ". Utiliser l'automatisation pour appuyer plutôt que prendre les décisions à forte incidence abaisse le niveau d'incidence algorithmique et ses exigences. Touche DIG-3 · comble ou réduit 1 lacune(s) actuelle(s) : DIG-3"
      - listitem:
        - strong: Débloquer le financement par tranches liées aux points de contrôle
        - text: ". N'engager l'argent que jusqu'au prochain point de contrôle limite l'exposition et donne aux responsables une véritable décision à chaque étape. Touche INV-5, APP-2, PLN-5 · comble ou réduit 1 lacune(s) actuelle(s) : INV-5"
      - listitem:
        - strong: Recueillir moins de renseignements personnels
        - text: . Chaque élément de renseignement personnel que vous ne recueillez pas réduit l'évaluation de la vie privée, la catégorisation de sécurité et l'exposition aux atteintes. Touche DIG-2, DIG-1, DIG-7
      - listitem:
        - strong: Convenir d'une carte agile des éléments probants avec les responsables
        - text: . Les responsables acceptent du logiciel fonctionnel, des plans de versions et des résultats mesurés au lieu de documents préalables lorsque c'est convenu à l'avance. Touche PLN-9, PLN-6, PLN-4, PLN-3
