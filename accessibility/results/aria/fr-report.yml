    - heading "Couverture de l'examen des documents" [level=2]
    - paragraph: L'examen des documents a trouvé des énoncés pertinents pour 23 exigences sur 66 dans 20 phrases. Les correspondances de mots clés sont des pistes, et non des preuves.
    - heading "11. Énoncés pour la présentation au point de contrôle" [level=2]
    - paragraph: Les énoncés marqués Ébauche ont été générés à partir de modèles et doivent être revus pour décrire ce qui est réellement en place.
    - heading "G1 Évaluation stratégique et concept" [level=3]
    - strong: GOV-1 Promoteur de projet responsable désigné
    - text: Obligatoire Satisfait Ébauche
    - paragraph: Assistant Deputy Minister, Service Delivery est le promoteur désigné de ClaimPath Online et en est responsable de la planification à la clôture. Le promoteur préside le comité directeur, est responsable de l'analyse de rentabilisation et des avantages, et approuve les présentations à chaque point de contrôle.
    - paragraph:
      - emphasis: "Éléments probants / notes :"
      - text: Designated in the deputy minister's decision record of 2026-02-10.
    - strong: GOV-3 Cadre ministériel de gestion de projet appliqué
    - text: Ministériel Ministériel Ébauche
    - paragraph: Fourni par le cadre ministériel. ClaimPath Online est inscrit auprès du bureau de gestion de projet de Department of Example Services et suit le cadre ministériel de gestion de projet, y compris sa norme sur les points de contrôle, ses exigences en matière d'éléments probants et ses comptes rendus de décision.
    - strong: GOV-4 Décisions aux points de contrôle consignées
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Les décisions aux points de contrôle de ClaimPath Online sont consignées dans un compte rendu qui énumère les éléments probants examinés, la décision, les conditions et l'approbateur. Le bureau de gestion de projet assure le suivi des conditions jusqu'à leur levée.
    - strong: INV-1 Problème et résultats définis
    - text: Obligatoire Satisfait Ébauche
    - paragraph: "ClaimPath Online répond au problème suivant : Applicants for the Example Benefit wait an average of 14 weeks for a decision and 30% of paper applications are returned as incomplete. The project will deliver an online application and case management service so that most applicants get a decision within four weeks. Les résultats attendus contribuent aux résultats ministériels de Department of Example Services."
    - strong: INV-2 Harmonisé avec le plan d'investissement ministériel
    - text: Obligatoire Satisfait Ébauche
    - paragraph: ClaimPath Online figure dans le plan d'investissement de Department of Example Services et a été priorisé par le comité ministériel des investissements.
    - strong: APP-8 Cas conceptuel numérique examiné par le DPI du GC
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Un cas conceptuel de ClaimPath Online a été approuvé par le responsable opérationnel, examiné par l'organe de surveillance des investissements de Department of Example Services et soumis au SCT pour examen par le dirigeant principal de l'information du gouvernement du Canada.
    - strong: MON-3 Leçons apprises consignées et partagées
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Les leçons apprises de ClaimPath Online ont été consignées à chaque point de contrôle et à la clôture, et partagées avec le bureau de gestion de projet de Department of Example Services.
    - heading "G2 Approche du projet" [level=3]
    - strong: GOV-2 Structure de gouvernance et pouvoirs décisionnels clairs
    - text: Obligatoire Partiellement satisfait Ébauche
    - paragraph: ClaimPath Online est régi par un comité directeur présidé par Assistant Deputy Minister, Service Delivery, selon un mandat qui établit les pouvoirs décisionnels, les voies de remontée et les tolérances en matière de coûts, de calendrier et de portée. Les décisions sont consignées et suivies. Cet énoncé décrit l'état visé. Les lacunes actuelles et les mesures sont consignées dans le plan d'action.
    - strong: GOV-6 Fonctions habilitantes consultées tôt
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Les fonctions habilitantes (approvisionnement, finances, TI, sécurité, protection de la vie privée et ressources humaines) ont été consultées lors de l'élaboration de l'approche de ClaimPath Online. Leurs conseils sont consignés et intégrés à l'approche.
    - strong: INV-3 Analyse des options
    - text: Obligatoire Partiellement satisfait Ébauche
    - paragraph: Les options pour ClaimPath Online, y compris le statu quo, ont été comparées selon des critères convenus à l'avance (coût, avantages, risque et adéquation). L'option privilégiée est justifiée dans l'analyse des options. Cet énoncé décrit l'état visé. Les lacunes actuelles et les mesures sont consignées dans le plan d'action.
    - paragraph:
      - emphasis: "Éléments probants / notes :"
      - text: Three options compared; GC enterprise case management not assessed.
    - strong: CAP-1 Évaluation de la complexité et des risques du projet (ECRP) réalisée
    - text: Obligatoire Non satisfait Ébauche
    - paragraph: Une évaluation de la complexité et des risques de ClaimPath Online a été réalisée avec l'outil du SCT et approuvée par le ministère. Le projet est évalué au niveau 3 (Évolution). L'évaluation est mise à jour à chaque point de contrôle important et chaque fois que la portée, le coût ou l'approche change de façon importante. Cet énoncé décrit l'état visé. Les lacunes actuelles et les mesures sont consignées dans le plan d'action.
    - paragraph:
      - emphasis: "Éléments probants / notes :"
      - text: Indicative estimate in this tool only.
    - strong: CAP-2 Catégorie de capacité ministérielle (ECOGP) à jour
    - text: Ministériel Ministériel Ébauche
    - paragraph: Fourni par le cadre ministériel. Department of Example Services dispose d'une évaluation approuvée de la capacité organisationnelle de gestion de projets, qui établit le pouvoir d'approbation des projets du ministère appliqué à ClaimPath Online.
    - strong: CAP-3 Pouvoir d'approbation déterminé
    - text: Obligatoire Partiellement satisfait Ébauche
    - paragraph: Le pouvoir d'approbation de ClaimPath Online a été déterminé conformément à l'annexe C de la Directive sur la gestion des projets et programmes, à partir de son coût estimatif, de son niveau d'ECRP et de la catégorie de capacité de Department of Example Services. L'approbation du projet par le Conseil du Trésor est requise. Cet énoncé décrit l'état visé. Les lacunes actuelles et les mesures sont consignées dans le plan d'action.
    - strong: APP-3 Engagement précoce auprès du Secrétariat du Conseil du Trésor
    - text: Obligatoire Non évalué Ébauche
    - paragraph: ClaimPath Online collabore avec le secteur de programme du Secrétariat du Conseil du Trésor et le Bureau du dirigeant principal de l'information depuis l'étape de l'approche; leurs attentes sont intégrées au plan.
    - strong: APP-4 Conseil d'examen de l'architecture intégrée du GC (CEAI du GC)
    - text: Obligatoire Non satisfait Ébauche
    - paragraph: ClaimPath Online a été présenté au conseil ministériel d'examen de l'architecture puis au Conseil d'examen de l'architecture intégrée du GC. Les conditions soulevées sont suivies par le projet et communiquées au prochain point de contrôle. Cet énoncé décrit l'état visé. Les lacunes actuelles et les mesures sont consignées dans le plan d'action.
    - strong: APP-5 Examen de l'architecture ministérielle et appui du DPI
    - text: Obligatoire Non évalué Ébauche
    - paragraph: Le conseil d'examen de l'architecture de Department of Example Services a examiné ClaimPath Online et le dirigeant principal de l'information a appuyé l'approche.
    - strong: GAT-1 Plan des points de contrôle défini
    - text: Obligatoire Non évalué Ébauche
    - paragraph: ClaimPath Online suit le modèle points de contrôle complets (sept). Le plan des points de contrôle désigne les responsables et les éléments probants attendus à chacun, et les dates font partie du calendrier intégré.
    - strong: GAT-4 Analyse de rentabilisation et viabilité revalidées à chaque point de contrôle
    - text: Obligatoire Non évalué Ébauche
    - paragraph: À chaque point de contrôle, ClaimPath Online revalide son analyse de rentabilisation, confirme que les avantages visés demeurent pertinents et atteignables, et consigne une décision sur sa viabilité continue et sur le respect des exigences du point de contrôle.
    - strong: PLN-1 Portée générale et exigences de haut niveau
    - text: Obligatoire Non évalué Ébauche
    - paragraph: La portée de ClaimPath Online est définie, y compris les exclusions explicites, les exigences de haut niveau rattachées aux résultats ainsi que les principales hypothèses et contraintes.
    - strong: RSK-1 Registre des risques géré activement
    - text: Obligatoire Partiellement satisfait Ébauche
    - paragraph: Les risques de ClaimPath Online sont consignés dans un registre avec leurs responsables et leurs réponses, examinés chaque mois par l'équipe de projet et à chaque réunion du comité directeur. Cet énoncé décrit l'état visé. Les lacunes actuelles et les mesures sont consignées dans le plan d'action.
    - heading "G3 Analyse de rentabilisation et état de préparation général" [level=3]
    - strong: INV-4 Analyse de rentabilisation approuvée
    - text: Obligatoire Partiellement satisfait Ébauche
    - paragraph: L'analyse de rentabilisation de ClaimPath Online a été approuvée par Assistant Deputy Minister, Service Delivery et le comité ministériel des investissements. Elle présente l'option recommandée, les coûts sur le cycle de vie, les avantages, les risques, le calendrier et le financement. Cet énoncé décrit l'état visé. Les lacunes actuelles et les mesures sont consignées dans le plan d'action.
