- main:
  - heading "1. Scope the project" [level=1]
  - paragraph: "Answer what you know. The governance summary updates as you go: complexity and risk, who approves the project, architecture review, the gating model and which requirements apply."
  - group "The project":
    - text: The project Project name
    - textbox "Project name":
      - /placeholder: e.g. Benefits Delivery Modernization, Phase 2
      - text: ClaimPath Online
    - paragraph: "Why we ask: Used throughout the report and the draft gate statements."
    - text: Department or agency
    - textbox "Department or agency":
      - /placeholder: e.g. Department of Example Services
      - text: Department of Example Services
    - paragraph: "Why we ask: The organization accountable for the project under the Directive on the Management of Projects and Programmes."
    - text: Project sponsor (title)
    - textbox "Project sponsor (title)":
      - /placeholder: e.g. Assistant Deputy Minister, Service Delivery
      - text: Assistant Deputy Minister, Service Delivery
    - paragraph: "Why we ask: The directive makes the sponsor accountable from planning to close-out. Every gate decision traces back to this person."
    - text: What problem does the project solve?
    - textbox "What problem does the project solve?":
      - /placeholder: The business need, who benefits and the outcomes sought...
      - text: Applicants for the Example Benefit wait an average of 14 weeks for a decision and 30% of paper applications are returned as incomplete. The project will deliver an online application and case management service so that most applicants get a decision within four weeks.
    - paragraph: "Why we ask: Gate 1 asks what is to be done and why. A one-paragraph problem statement is the first thing a gatekeeper reads."
  - group "Size and nature":
