- main:
  - heading "1. Définir la portée du projet" [level=1]
  - paragraph: "Répondez à ce que vous savez. Le sommaire de gouvernance se met à jour au fur et à mesure : complexité et risques, qui approuve le projet, examen de l'architecture, modèle de points de contrôle et exigences applicables."
  - group "Le projet":
    - text: Le projet Nom du projet
    - textbox "Nom du projet":
      - /placeholder: p. ex. Modernisation du versement des prestations, phase 2
      - text: ClaimPath Online
    - paragraph: "Pourquoi nous le demandons : Utilisé dans tout le rapport et dans les ébauches d'énoncés pour les points de contrôle."
    - text: Ministère ou organisme
    - textbox "Ministère ou organisme":
      - /placeholder: p. ex. Ministère des Services exemplaires
      - text: Department of Example Services
    - paragraph: "Pourquoi nous le demandons : L'organisation responsable du projet en vertu de la Directive sur la gestion des projets et programmes."
    - text: Promoteur du projet (titre)
    - textbox "Promoteur du projet (titre)":
      - /placeholder: p. ex. Sous-ministre adjoint, Prestation des services
      - text: Assistant Deputy Minister, Service Delivery
    - paragraph: "Pourquoi nous le demandons : La directive rend le promoteur responsable de la planification à la clôture. Chaque décision aux points de contrôle remonte à cette personne."
    - text: Quel problème le projet résout-il?
    - textbox "Quel problème le projet résout-il?":
      - /placeholder: Le besoin opérationnel, les bénéficiaires et les résultats recherchés...
      - text: Applicants for the Example Benefit wait an average of 14 weeks for a decision and 30% of paper applications are returned as incomplete. The project will deliver an online application and case management service so that most applicants get a decision within four weeks.
    - paragraph: "Pourquoi nous le demandons : Le point de contrôle 1 demande ce qui doit être fait et pourquoi. Un énoncé du problème d'un paragraphe est la première chose que lit un responsable de point de contrôle."
  - group "Taille et nature":
    - text: Taille et nature De quel type de projet s'agit-il?
    - radiogroup "De quel type de projet s'agit-il?":
