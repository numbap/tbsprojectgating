      - text: Oui
      - radio "Non" [checked]
      - text: Non
    - paragraph: "Pourquoi nous le demandons : La directive vise aussi les programmes : les résultats, les interdépendances et la gouvernance sont gérés à l'échelle du programme."
  - group "Capacité, complexité et pouvoir":
    - text: Capacité, complexité et pouvoir Catégorie approuvée de capacité organisationnelle de gestion de projets de votre ministère (ECOGP)
    - radiogroup "Catégorie approuvée de capacité organisationnelle de gestion de projets de votre ministère (ECOGP)":
