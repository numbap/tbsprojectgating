    - paragraph: "Pourquoi nous le demandons : La catégorie approuvée par le Conseil du Trésor détermine le pouvoir d'approbation des projets du ministre (Directive sur la gestion des projets et programmes, annexe C). Avec une catégorie 1 ou plus, le ministère approuve les projets dont le niveau d'ECRP ne dépasse pas sa catégorie, quel que soit leur coût. Renseignez-vous auprès de votre bureau de gestion de projet; la catégorie est soumise de nouveau au moins tous les trois ans."
    - text: Niveau de l'évaluation de la complexité et des risques du projet (ECRP)
