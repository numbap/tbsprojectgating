      - text: Numérique ou habilité par la TI
      - radio "Biens immobiliers ou infrastructure"
      - text: Biens immobiliers ou infrastructure
      - radio "Transformation opérationnelle ou de programme (peu de TI)"
      - text: Transformation opérationnelle ou de programme (peu de TI)
      - radio "Mixte (numérique et biens immobiliers)"
      - text: Mixte (numérique et biens immobiliers)
    - paragraph: "Pourquoi nous le demandons : Les projets numériques font intervenir la Politique sur les services et le numérique (examen de l'architecture, autorisation de sécurité, accessibilité). Les projets de biens immobiliers font intervenir les pouvoirs relatifs aux biens immobiliers."
    - text: Coût total estimatif du projet (taxes comprises)
    - radiogroup "Coût total estimatif du projet (taxes comprises)":
      - radio "Moins de 1 M$"
      - text: Moins de 1 M$
