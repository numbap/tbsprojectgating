      - text: De 25 M$ à 50 M$
      - radio "De 50 M$ à 100 M$"
      - text: De 50 M$ à 100 M$
      - radio "De 100 M$ à 1 G$"
      - text: De 100 M$ à 1 G$
      - radio "Plus de 1 G$"
      - text: Plus de 1 G$
    - paragraph: "Pourquoi nous le demandons : Sans catégorie de capacité approuvée, les projets de plus de 2,5 M$ doivent être approuvés par le Conseil du Trésor. Le coût détermine aussi si une ECRP est requise, si un projet numérique exige un cas conceptuel et un examen par le CEAI du GC, et si des données de référence doivent être transmises au Bureau du contrôleur général (25 M$ ou plus)."
    - text: Le projet a-t-il besoin de nouveaux fonds ou de nouvelles autorisations (au-delà des niveaux de référence existants)?
    - radiogroup "Le projet a-t-il besoin de nouveaux fonds ou de nouvelles autorisations (au-delà des niveaux de référence existants)?":
      - radio "Oui" [checked]
      - text: Oui
      - radio "Non"
      - text: Non
    - paragraph: "Pourquoi nous le demandons : De nouveaux fonds signifient habituellement un processus budgétaire ou un mémoire au Cabinet suivi d'une présentation au Conseil du Trésor, même lorsque le projet relève du pouvoir d'approbation ministériel."
    - text: Est-il horizontal (plusieurs ministères, organismes ou administrations)?
    - radiogroup "Est-il horizontal (plusieurs ministères, organismes ou administrations)?":
      - radio "Oui"
      - text: Oui
      - radio "Non" [checked]
      - text: Non
    - paragraph: "Pourquoi nous le demandons : Selon le guide de l'ECRP, les projets horizontaux sont transformationnels par nature, et leur gouvernance doit fonctionner entre organisations."
    - text: Fait-il partie d'un programme (un groupe de projets connexes gérés ensemble)?
