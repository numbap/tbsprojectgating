  - 'link "CAP-1 high Required Not met Project Complexity and Risk Assessment (PCRA) completed Above the threshold for the department''s class ($2.5M with no class or class 0, then $5M, $10M, $25M and $50M for classes 1 to 4), the PCRA is completed with the TBS tool over the project''s full scope and life cycle, and submitted to TBS with its supporting evidence before definition begins. TBS reviews it within 15 working days; it is reassessed if complexity or risk increases significantly. Its level (1 Sustaining to 4 Transformational) sets approval authority and oversight. Gate 2 · Approach · Right-size it: Reducing real complexity (smaller releases, fewer integrations, proven technology) lowers the PCRA honestly; scoring it lower does not."':
