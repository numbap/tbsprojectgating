  - 'link "CAP-3 high Required Partly met Approval authority determined Without an approved OPMCA class of 1 or higher, every project over $2.5M (taxes included) needs Treasury Board approval. With class 1 or higher, authority depends on the relationship between the class and the project''s PCRA level: a level above the class needs Treasury Board approval. Treasury Board may call in any project, and no action is taken without the required authorities. Gate 2 · Approach · Right-size it: Splitting a project to stay under the limit is not allowed; delivering in genuinely independent phases with their own outcomes may be."':
