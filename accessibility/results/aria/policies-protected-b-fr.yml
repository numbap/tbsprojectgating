  - paragraph: Cette page explique comment l'application est conçue pour protéger l'information Protégé B, comment cela correspond aux exigences de sécurité du gouvernement du Canada, et ce qui doit être vrai de votre environnement pour que ces protections tiennent. Les mises en garde de la section 5 font partie de l'énoncé; ce ne sont pas des notes de bas de page.
  - blockquote:
    - paragraph:
      - text: La cote
      - strong: Protégé B
      - text: "s'applique à l'information dont la compromission risquerait vraisemblablement de causer un préjudice grave à une personne, à une organisation ou au gouvernement. Une évaluation de projet à un point de contrôle contient souvent de l'information de ce genre : demandes de financement non annoncées et présentations au Cabinet ou au Conseil du Trésor, estimations de coûts et provisions pour éventualités, stratégie d'approvisionnement avant la publication d'une demande de soumissions, et constats francs sur les risques et les faiblesses. L'application utilise donc"
      - strong: Protégé B
      - text: comme cote par défaut. Ne choisissez une cote inférieure que lorsque le contenu le justifie clairement.
