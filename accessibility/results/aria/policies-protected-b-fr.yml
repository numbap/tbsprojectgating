  - heading "3. Mesures de protection en détail" [level=2]
  - heading "3.1 Aucune transmission d'information" [level=3]
  - list:
    - listitem: L'application est constituée de HTML, de CSS et de JavaScript statiques. Tout le traitement (y compris l'examen des documents de projet collés) se fait dans l'onglet du navigateur.
    - listitem:
      - text: Chaque page déclare une
      - strong: politique de sécurité du contenu
      - text: ":"
      - code: default-src 'none'; connect-src 'none'; form-action 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; object-src 'none'
      - text: . Le navigateur bloque donc les connexions réseau, les soumissions de formulaires, les scripts intégrés et distants et le contenu distant, même si un attaquant parvenait à injecter du balisage.
      - code: referrer
      - text: est défini à
      - code: no-referrer
      - text: .
    - listitem: Aucune bibliothèque de tiers n'est utilisée à l'exécution; il n'y a ni outils d'analyse, ni polices ou images d'autres sites, ni témoins.
    - listitem:
      - text: Les essais automatisés font échouer la compilation si le code client utilise une interface réseau ou de témoins, ou si la politique de sécurité du contenu est affaiblie. Un essai dans le navigateur confirme que
      - code: fetch
      - text: est bloqué.
  - heading "3.2 Chiffrement au repos" [level=3]
  - list:
    - listitem:
      - strong: "Algorithme :"
      - text: AES-256 en mode GCM (chiffrement authentifié), avec un nouveau vecteur d'initialisation aléatoire de 96 bits à chaque enregistrement.
    - listitem:
      - strong: "Dérivation de clé :"
      - text: PBKDF2-HMAC-SHA-256, 600 000 itérations, sel aléatoire de 128 bits. Les enveloppes de moins de 100 000 itérations sont refusées.
    - listitem: AES et SHA-256 figurent parmi les algorithmes approuvés par l'ITSP.40.111 pour l'information Protégé B. PBKDF2 est la fonction de dérivation de clé à partir d'un mot de passe décrite dans la publication NIST SP 800-132.
    - listitem:
      - text: Les clés sont créées comme clés Web Crypto
      - strong: non extractibles
      - text: et n'existent qu'en mémoire pendant le déverrouillage. La phrase de passe n'est jamais stockée.
    - listitem: La cote de sécurité et les paramètres de dérivation de clé sont liés au texte chiffré à titre de données authentifiées; ils ne peuvent donc pas être modifiés sans que ce soit détecté.
    - listitem:
      - strong: "Application de la politique dans le code :"
      - text: la couche de stockage refuse d'écrire une évaluation Protégé A ou Protégé B sans chiffrement dans le stockage du navigateur. Des essais unitaires le vérifient.
    - listitem:
      - text: Choisir
      - strong: Non enregistré
      - text: garde l'évaluation uniquement dans la mémoire de l'onglet.
  - heading "3.3 Accès à l'évaluation stockée" [level=3]
  - list:
    - listitem: Le déverrouillage exige la phrase de passe (au moins 15 caractères). Les gestionnaires de mots de passe et le collage sont pris en charge, comme l'exige le critère 3.3.8 des WCAG 2.2.
    - listitem:
      - strong: Verrouillage automatique
      - text: après 15 minutes d'inactivité par défaut, réglable de 15 minutes à 8 heures ou désactivé. Le bouton
      - strong: Verrouiller
      - text: est toujours offert dans l'en-tête. Le verrouillage efface l'évaluation déchiffrée de la page.
    - listitem: L'application refuse de fonctionner dans un cadre (iframe), ce qui empêche d'autres pages de l'intégrer pour lire le contenu déchiffré.
  - heading "3.4 Marquage" [level=3]
  - list:
    - listitem:
      - text: Un bandeau en haut de chaque écran indique la cote (par exemple
      - strong: PROTÉGÉ B
      - text: ), le mode de stockage et « Les données restent sur cet appareil ».
    - listitem:
      - text: Les rapports affichent la cote en haut et en bas. Les impressions la répètent en haut à droite et en bas de
      - strong: chaque page
      - text: .
    - listitem:
      - text: Le nom des fichiers téléchargés comprend la cote (par exemple
      - code: …-PROTECTED-B-fr.md
      - text: ). Les fichiers Markdown et CSV commencent par la cote, et les fichiers chiffrés la portent dans leur en-tête authentifié.
  - heading "3.5 Exportation et déplacement de l'information" [level=3]
  - list:
    - listitem:
      - text: L'
      - strong: exportation chiffrée
      - text: utilise une phrase de passe distincte que vous choisissez, de sorte que le fichier peut être déplacé sans révéler la phrase de passe du navigateur. Transmettez la phrase de passe par une autre voie que le fichier.
    - listitem: Les rapports Markdown ou CSV et les exportations JSON non chiffrées ne peuvent pas être chiffrés par l'application. Lorsque la cote est Protégé, l'application vous demande de confirmer avant le téléchargement et vous rappelle de ne stocker le fichier que sur des systèmes approuvés.
  - heading "3.6 Élimination" [level=3]
  - list:
    - listitem:
      - strong: Données et sécurité → Effacer toutes les données de ce navigateur
      - text: supprime tout ce que l'application stocke.
    - listitem: Comme les évaluations stockées sont chiffrées, la suppression des données chiffrées et l'oubli de la clé rendent illisibles les résidus éventuels sur le disque (effacement cryptographique).
