  - heading "5. Mises en garde et dépendances" [level=2]
  - paragraph:
    - text: Ces conditions sont
    - strong: nécessaires
    - text: pour que les mesures ci-dessus aient un sens. Plusieurs dépendent de la façon et de l'endroit où l'application est déployée, ou d'autorisations que l'application ne peut contrôler.
  - heading "5.1 L'appareil" [level=3]
  - paragraph:
    - text: N'utilisez l'application que sur un
    - strong: appareil géré par le gouvernement du Canada et autorisé pour l'information Protégé B
    - text: ", doté du chiffrement intégral du disque, de correctifs à jour, d'une protection des terminaux et d'un verrouillage d'écran imposé. N'utilisez pas d'appareils personnels ou partagés. Le stockage du navigateur réside sur le disque, dans le profil du navigateur de l'utilisateur. Le chiffrement de l'application est une défense en profondeur et"
    - strong: ne remplace pas le chiffrement de l'appareil
    - text: .
  - paragraph:
    - text: Les
    - strong: extensions de navigateur
    - text: peuvent lire le contenu de n'importe quelle page, y compris les évaluations déchiffrées. Les ministères devraient restreindre les extensions sur les appareils utilisés pour l'information Protégé B.
  - heading "5.2 Provenance du code (hébergement et origine)" [level=3]
  - list:
    - listitem:
      - strong: GitHub Pages n'est pas un service ministériel.
      - text: Il ne sert que le code de l'application et ne reçoit jamais le contenu des évaluations. Toutefois, quiconque contrôle le dépôt contrôle le code qu'exécute votre navigateur. Une modification compromise ou malveillante pourrait supprimer ces protections. Utilisez une version examinée.
    - listitem:
      - text: Sur
      - code: github.io
      - text: ","
      - strong: tous les sites GitHub Pages d'un même compte partagent une même origine
      - text: (par exemple
      - code: https://numbap.github.io
      - text: ) et donc le même stockage de navigateur. Les autres sites de ce compte pourraient lire les données chiffrées (sans pouvoir les déchiffrer), les supprimer ou les remplacer. L'authentification GCM détecte le remplacement.
    - listitem:
      - text: GitHub Pages ne peut pas envoyer d'en-têtes de sécurité HTTP personnalisés (comme
      - code: frame-ancestors
      - text: ","
      - code: X-Content-Type-Options
      - text: ou une politique de sécurité du contenu transmise par en-tête). L'application compense par une politique
      - code: <meta>
      - text: et une vérification de cadre dans le code, qui offrent une protection moindre.
    - listitem:
      - strong: "Recommandation pour l'utilisation avec de l'information Protégé B :"
      - text: le ministère devrait héberger une copie examinée et figée à une version donnée sur sa propre infrastructure ou un hébergement approuvé, sur une
      - strong: origine dédiée
      - text: (son propre nom d'hôte), avec des en-têtes de sécurité définis par le serveur. La commande
      - code: npm start
      - text: sert l'application localement.
  - heading "5.3 Validation du module cryptographique" [level=3]
  - paragraph:
    - text: L'application utilise l'implémentation Web Crypto intégrée au navigateur. La question de savoir s'il s'agit d'un
    - strong: module validé par le PVMC (FIPS 140-2/140-3)
    - text: dépend du navigateur, du système d'exploitation et de la configuration, et
    - strong: ne peut généralement pas être garantie
    - text: . Si les normes ministérielles exigent une cryptographie validée pour l'information Protégé B au repos (ITSG-33 IA-7 et SC-13), fiez-vous au chiffrement intégral et validé du disque de l'appareil comme mesure principale.
  - heading "5.4 Phrases de passe" [level=3]
  - list:
    - listitem: La protection n'est pas plus forte que la phrase de passe. La longueur minimale est imposée; la robustesse au-delà n'est pas mesurée.
    - listitem:
      - text: Il n'y a
      - strong: aucune récupération de la phrase de passe
      - text: . Une phrase oubliée signifie que l'évaluation stockée est perdue; conservez des exportations chiffrées comme copies de sauvegarde.
    - listitem: Il n'y a pas de blocage après des tentatives infructueuses. Une personne disposant d'une copie du profil du navigateur peut essayer des phrases de passe hors ligne; la dérivation de clé à 600 000 itérations la ralentit sans pouvoir l'empêcher.
  - heading "5.5 Mémoire et résidus" [level=3]
  - paragraph: JavaScript ne peut pas effacer la mémoire de façon fiable. Pendant qu'une évaluation est déverrouillée, et un certain temps après, du contenu déchiffré peut subsister en mémoire, dans le fichier d'échange, les fichiers de mise en veille prolongée ou les vidages sur incident. Le chiffrement intégral du disque et les procédures ministérielles d'assainissement (ITSP.40.006) visent ces copies. Les sauvegardes du navigateur, les profils itinérants ou les dossiers synchronisés peuvent copier les données chiffrées; vérifiez la configuration ministérielle.
  - heading "5.6 Fichiers que vous créez" [level=3]
  - paragraph:
    - text: Les rapports Markdown et CSV, les exportations JSON non chiffrées, les impressions et les PDF produits par le navigateur ne sont
    - strong: pas chiffrés
    - text: . Stockez-les uniquement dans des dépôts approuvés pour l'information Protégé B, marquez-les et transmettez-les uniquement par des voies approuvées (par exemple des systèmes de collaboration ministériels approuvés pour Protégé B ou un courriel chiffré). Vérifiez que le dossier de téléchargement du navigateur n'est pas synchronisé avec un service infonuagique non approuvé. Le contenu copié dans le presse-papiers peut être visible par d'autres applications ou l'historique du presse-papiers.
  - heading "5.7 Aucune piste de vérification" [level=3]
  - paragraph: L'application ne consigne pas qui a ouvert ou modifié une évaluation; elle ne satisfait donc pas aux exigences de vérification de l'ITSG-33 (famille AU) applicables aux systèmes de documents officiels. Utilisez-la comme outil de travail et conservez les documents officiels dans les systèmes ministériels.
  - heading "5.8 Responsabilités des utilisateurs" [level=3]
  - paragraph:
    - text: La cote reflète ce que l'utilisateur choisit. Le choix d'une cote ne rend pas à lui seul le traitement conforme. Les utilisateurs doivent respecter les règles ministérielles sur le besoin de savoir, le stockage, la transmission et l'élimination.
    - strong: L'information Protégé C et classifiée n'est pas prise en charge.
  - heading "5.9 Statut du présent énoncé" [level=3]
  - paragraph:
    - text: Cet énoncé a été préparé en même temps que le code de l'application par un assistant d'IA (Claude, Anthropic). Il s'agit d'un énoncé de conception appuyé par des essais automatisés, et
    - strong: non
    - text: d'une évaluation par une autorité ministérielle de sécurité. L'application n'a pas fait l'objet d'une évaluation de la sécurité et d'une autorisation (EAS). Avant de l'utiliser avec de l'information Protégé B, obtenez une approbation au moyen du processus de sécurité de votre ministère. Ce processus peut traiter l'application comme un outil utilisé sur un terminal déjà autorisé.
